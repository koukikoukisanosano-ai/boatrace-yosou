name: 試し（公式サイトの過去オッズが見られるか）
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -A "boatrace-yosou/1.0" "https://www.boatrace.jp/owpc/pc/race/odds2tf?rno=1&jcd=12&hd=20230610" -o p.html
          python3 - <<'P'
          s=open('p.html',encoding='utf-8').read()
          i=s.find('2連単'); j=s.find('oddsPoint')
          print(s[j-2500:j+1800])
          P
          curl -sS -A "boatrace-yosou/1.0" "https://www.boatrace.jp/owpc/pc/race/odds2tf?rno=1&jcd=12&hd=20250115" -o q.html
          python3 -c "import re;s=open('q.html',encoding='utf-8').read();print(re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',s))[-1500:])"
