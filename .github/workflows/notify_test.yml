name: 通知のテスト

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: テスト通知を送る
        run: |
          python3 - <<'PY'
          import json, urllib.request
          cfg = json.load(open("docs/notify.json"))
          msg = {"topic": cfg["topic"], "title": "テスト通知（競艇予想）", "message": "通知の設定ができています。締切1分前に買い目が決まると、このように届きます。", "tags": ["white_check_mark"], "click": cfg["page"]}
          req = urllib.request.Request("https://ntfy.sh/", data=json.dumps(msg, ensure_ascii=False).encode(), method="POST")
          print(urllib.request.urlopen(req, timeout=20).status)
          PY
