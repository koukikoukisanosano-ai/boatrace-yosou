name: 公平な検証（月ごとに予想し直す）

on:
  schedule:
    - cron: '7 17 1 * *'    # 毎月2日 2:07（日本時間）: 先月までで検証し直す
  workflow_dispatch:
    inputs:
      months:
        description: '予想し直す月（JSON の配列。空なら2026-01〜先月）'
        default: ''
      variants:
        description: '試しに作る予想（例 rank,tenkai_l63）。空なら本番と同じものだけ'
        default: ''
      mbrace:
        description: '公式の過去データを足す年。空なら本番と同じ（2016 2017 2018 2019 2020 2021 2022 2023 2024）、none なら足さない'
        default: ''
      train_from:
        description: '学習に使う最初の日。空なら本番と同じ（2020-01-01。過去データを足さないときは 2024-11-01）'
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  months:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.m.outputs.list }}
    steps:
      - id: m
        run: |
          if [ -n "${{ inputs.months }}" ]; then echo 'list=${{ inputs.months }}' >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 -c "
          import datetime, json
          t = datetime.date.today().replace(day=1); ms = []; d = datetime.date(2026, 1, 1)
          while d < t:
              ms.append(d.strftime('%Y-%m')); d = (d.replace(day=28) + datetime.timedelta(days=4)).replace(day=1)
          print('list=' + json.dumps(ms))" >> "$GITHUB_OUTPUT"
  fit:
    needs: months
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        month: ${{ fromJSON(needs.months.outputs.list) }}
    env:
      TZ: Asia/Tokyo
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt lightgbm
      - name: 公式の過去データ（none のときは使わない）
        if: inputs.mbrace != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/mbrace
          for y in ${{ inputs.mbrace || '2016 2017 2018 2019 2020 2021 2022 2023 2024' }}; do gh release download mbrace-data -p "mbrace_$y.tar" -O - | tar xf - -C data/mbrace; done
          echo "EXTRA=--extra=data/mbrace --rows-from=${{ inputs.train_from || '2020-01-01' }}" >> "$GITHUB_ENV"
      - name: 学習用の表
        run: node --max-old-space-size=10240 tools/build_dataset.mjs work/full $EXTRA
      - name: その月より前だけで学習して、その月を予想
        run: python tools/fair_fit.py --work work/full --month ${{ matrix.month }} --out fair_${{ matrix.month }}.pkl --variants "${{ inputs.variants }}" --train-from "${{ inputs.train_from || (inputs.mbrace == 'none' && '2024-11-01') || '2020-01-01' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: fair_${{ matrix.month }}
          path: fair_${{ matrix.month }}.pkl
          retention-days: 7
  eval:
    needs: fit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Tokyo
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: fair
      - name: 学習用の表（払戻）
        run: node --max-old-space-size=6144 tools/build_dataset.mjs work/full
      - name: 月ごとに、それより前だけで選んだ買い方で答え合わせ
        run: python tools/fair_eval.py --preds fair --work work/full --min-odds 10 | tee fair.log   # 10倍以下は買わない
      - name: 保存（試しの検証のときは保存しない）
        if: inputs.mbrace == '' && inputs.variants == '' && inputs.train_from == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/fair.json
          git commit -q -m "公平な検証の結果 $(date '+%Y-%m-%d')" || exit 0
          for i in 1 2 3 4 5 6; do
            if git pull -q --rebase -X theirs && git push -q; then echo "保存しました"; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
