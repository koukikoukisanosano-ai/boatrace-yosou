name: 試し（Pythonを1回動かす）
on:
  workflow_dispatch:
    inputs:
      code:
        description: 'python -c で動かすコード'
        required: true
permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          CODE: ${{ inputs.code }}
        run: python -c "$CODE"
