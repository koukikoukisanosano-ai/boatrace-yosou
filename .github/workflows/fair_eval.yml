name: 公平な検証（採点）

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: '「公平な検証（月ごとに予想し直す）」の実行ID'
        required: true
      save:
        description: '結果を本番の検証結果（fair.json）として保存する'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Tokyo
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: fair
      - name: 学習用の表（払戻）
        run: node --max-old-space-size=6144 tools/build_dataset.mjs work/full
      - name: 月ごとに、それより前だけで選んだ買い方で答え合わせ
        run: python tools/fair_eval.py --preds fair --work work/full | tee fair.log
      - name: 保存
        if: inputs.save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/fair.json
          git commit -q -m "公平な検証の結果 $(date '+%Y-%m-%d')" || exit 0
          for i in 1 2 3 4 5 6; do
            if git pull -q --rebase -X theirs && git push -q; then echo "保存しました"; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
