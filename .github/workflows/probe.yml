name: 外部データの確認

on:
  workflow_dispatch:
    inputs:
      urls:
        description: '確認するURL（空白区切り）'
        required: true
      lines:
        description: '表示する行数'
        default: '0'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 取れるか確かめる
        run: |
          sudo apt-get install -y -q lhasa nkf > /dev/null
          for u in ${{ inputs.urls }}; do
            code=$(curl -s -o /tmp/f -w '%{http_code} %{size_download} %{content_type}' -A 'Mozilla/5.0' "$u")
            echo "$u -> $code"
            if [ "${{ inputs.lines }}" != "0" ]; then
              rm -rf /tmp/x && mkdir /tmp/x && cd /tmp/x && lha xq /tmp/f && for t in *; do echo "== $t"; nkf -w "$t" | head -n ${{ inputs.lines }}; done; cd -
            fi
          done
