name: 予想方法の比較（週1）

on:
  schedule:
    - cron: '7 15 * * 0'    # 毎週日曜 24:07（日本時間）
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TZ: Asia/Tokyo
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: 学習用の表
        run: node tools/build_dataset.mjs work/full
      - name: 2連単（メイン）- オッズを混ぜない予想を作り直す（開発期間・本番テスト期間）
        run: python tools/research_exacta.py fit --work work/full --big
      - name: 2連単（メイン）- 予想の混ぜ方と買い方を比べる
        run: python tools/research_exacta.py eval --work work/full
      - name: 仮想で買い続けた場合の損益（ページのグラフ）
        run: python tools/make_sim.py --work work/full
      - name: 保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/research_exacta.json docs/data/sim.json
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -q -m "予想方法の比較 $(date '+%Y-%m-%d')"
          for i in 1 2 3 4 5 6; do
            if git pull -q --rebase -X theirs && git push -q; then echo "保存しました"; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          gh workflow run pages.yml --ref main || true
