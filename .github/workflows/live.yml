name: 直前情報の自動取得

on:
  schedule:
    # 1回の実行は最長5時間半。途中で止まっても次の予定で再開する（同時には1つだけ動く）
    - cron: '50 22 * * *'   # 7:50（日本時間）
    - cron: '50 0 * * *'    # 9:50
    - cron: '50 2 * * *'    # 11:50
    - cron: '50 4 * * *'    # 13:50
    - cron: '50 6 * * *'    # 15:50
    - cron: '50 8 * * *'    # 17:50
    - cron: '20 10 * * *'   # 19:20
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      TZ: Asia/Tokyo
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: 直前情報を取りつづける（締切1分前に買い目を決めて通知）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python tools/live.py --max-minutes 330
      - name: 続きをすぐ始める（予定の時刻に始まらないことがあるので、自分で次を予約する）
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/live_continue" ]; then
            for i in 1 2 3; do gh workflow run live.yml --ref main && echo "次の実行を予約しました" && break; sleep 10; done
          fi
