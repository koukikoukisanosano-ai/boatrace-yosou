name: 直前情報の自動取得

on:
  schedule:
    # 1回の実行は最長5時間半。同時には1つだけ動き、予定で来た分は前の実行が終わるまで待つ。
    # 実行が途中で落ちても（11/26 17:13 のように後片付けも動かないことがある）、30分おきの予定ですぐ再開する
    - cron: '*/30 22,23 * * *'   # 7:00〜8:30（日本時間）
    - cron: '*/30 0-11 * * *'    # 9:00〜20:30
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      TZ: Asia/Tokyo
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: 毎朝の準備が遅れていたら代わりに動かす（GitHubの予定実行は何時間も遅れることがある）
        run: |
          Y=$(date -d yesterday +%F)
          if python -c "import json,sys;d=[x['date'] for x in json.load(open('docs/data/report.json'))['days']];sys.exit(0 if '$Y' in d else 1)"; then
            echo "昨日（$Y）の記録あり"
          elif [ "$(date +%H)" -ge 6 ] && [ -z "$(gh run list -w daily.yml -s in_progress -L 1 -q '.[].databaseId' --json databaseId)$(gh run list -w daily.yml -s queued -L 1 -q '.[].databaseId' --json databaseId)" ]; then
            gh workflow run daily.yml --ref main && echo "毎朝の準備を動かしました"
          fi
      - name: 直前情報を取りつづける（締切1分前に買い目を決めて通知）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python tools/live.py --max-minutes 330
      - name: 続きをすぐ始める（予定の時刻に始まらないことがあるので、自分で次を予約する）
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/live_continue" ]; then
            for i in 1 2 3; do gh workflow run live.yml --ref main && echo "次の実行を予約しました" && break; sleep 10; done
          fi
