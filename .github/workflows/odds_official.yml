name: 公式サイトの過去オッズ（2連単・検証用）

on:
  workflow_dispatch:
    inputs:
      months:
        description: '取る月（JSON の配列。例 ["2025-01","2025-02"]）'
        required: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: 確かめる（Turnmark の確定オッズがある日と比べて同じか）
        run: |
          ODDS_OUT=chk python tools/fetch_official_odds.py --from 2026-10-01 --to 2026-10-01 --limit 40
          python3 - <<'P'
          import gzip, json
          a = json.loads(gzip.decompress(open('chk/2026/20261001.json.gz','rb').read()))
          b = json.loads(gzip.decompress(open('data/odds/2026/20261001.json.gz','rb').read()))
          n = same = 0
          for k, v in a.items():
              for x, y in zip(v['e'], b[k]['e']):
                  n += 1; same += (x == y)
          print(f'{len(a)} レース・{n} 通り中 {same} 通りが一致')
          assert len(a) >= 30 and same >= 0.98 * n, '一致しません'
          P
  parts:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.p.outputs.list }}
    steps:
      - id: p
        env:
          MONTHS: ${{ inputs.months }}
        run: |
          python3 -c "
          import json, os
          ms = json.loads(os.environ['MONTHS'])
          print('list=' + json.dumps([f'{m}/{k}' for m in ms for k in (1, 2, 3)]))" >> "$GITHUB_OUTPUT"
  fetch:
    needs: parts
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        part: ${{ fromJSON(needs.parts.outputs.list) }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: 取る
        env:
          PART: ${{ matrix.part }}
        run: |
          # 1か月を3つに分ける（1〜10日・11〜20日・21日〜月末）。公式サイトの応答が1件10秒ほどかかるため
          M=${PART%/*}; K=${PART#*/}
          case $K in 1) S=$M-01; E=$M-10;; 2) S=$M-11; E=$M-20;; 3) S=$M-21; E=$(date -d "$M-01 +1 month -1 day" +%F);; esac
          python tools/fetch_official_odds.py --from $S --to $E --wait 0.5
      - name: 保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds
          git commit -q -m "公式サイトの過去オッズ ${{ matrix.part }}" || exit 0
          for i in 1 2 3 4 5 6 7 8; do
            if git pull -q --rebase && git push -q; then echo "保存しました"; exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 7))
          done
          exit 1
